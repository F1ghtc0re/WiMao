# Dépôt APT signé de WiMao, publié sur GitHub Pages (spécification : sous-projet 6, § 5).
#
# La CI ne détient AUCUNE clé : l'index APT (depot-apt/) est signé sur la machine du propriétaire
# (scripts/publier-depot-apt.sh) et poussé dans le dépôt. Ici, on ne fait que le VÉRIFIER, assembler le site
# puis le publier.
#
# Jobs :
#   assembler    : scripts/assembler-site-apt.sh vérifie la signature de l'index, télécharge les .deb depuis les
#                  Releases GitHub, contrôle taille et SHA256 de chacun, et construit le site (site/). Avant la
#                  première publication, depot-apt/ n'existe pas : le script rend le code 3, le job réussit avec
#                  la sortie `vide=true` et les deux jobs suivants sont sautés.
#   installation : installe `wimao` DEPUIS le site assemblé (source `file:`) dans un système vierge, Ubuntu 24.04
#                  et Debian 13, puis prouve qu'un .deb altéré d'un seul octet est refusé par apt.
#   installation-dnf : le pendant Fedora de `installation`, SEULEMENT quand le site contient un dépôt dnf
#                  (depot-dnf/rpm/repodata/ existe ; sinon la sortie `dnf=false` saute le job, sans rien bloquer).
#                  Dans un Fedora 44 et un Fedora 45 vierges, scripts/tests/tester-installation-dnf.sh sert le site
#                  assemblé par `python3 -m http.server`, réécrit le .repo pour pointer vers lui, prouve qu'un
#                  repomd.xml modifié d'un seul caractère rend `wimao` introuvable (signature refusée), puis
#                  installe wimao, wimao-bridge et wimao-wine. Les RPM sont téléchargés aux adresses de l'index
#                  signé, c'est-à-dire sur les Releases GitHub : elles existent forcément à ce stade, puisque
#                  `assembler` les vient de télécharger et de contrôler. Aucun mode d'essai n'est donc utile ici ;
#                  l'essai local avec de faux RPM et un second serveur est
#                  scripts/tests/tester-depot-dnf-bout-en-bout.sh (hors CI : il sert à valider la chaîne avant
#                  la première publication d'un index dnf).
#   deployer     : publie le site sur GitHub Pages ; seulement sur `main` (jamais sur demande de fusion).
#                  SEUL job qui dispose de `pages: write` et `id-token: write` (paquets/verifier-workflows.sh,
#                  règle 5, le contrôle dans les deux sens).
#
# `workflow_dispatch` lancé sur une autre branche que main exécute `assembler`, `installation` et
# `installation-dnf`, mais saute `deployer` : seul main publie.
#
# Choix communs :
#   - actions figées par empreinte de commit (commentaire = étiquette), contrôlé par paquets/verifier-workflows.sh ;
#   - WIMAO_SOURCE_RELEASES n'est JAMAIS définie ici : le script la refuse hors mode essai, il télécharge donc
#     toujours les vrais .deb depuis github.com.
name: Dépôt APT

on:
  pull_request:
    paths:
      - "depot-apt/**"
      - "depot-dnf/**"
      - "docs/cle-publique.asc"
      - ".github/workflows/depot-apt.yml"
      - "scripts/assembler-site-apt.sh"
      - "scripts/lib/publication.sh"
      - "scripts/lib/lire-index-dnf.py"
      - "scripts/tests/tester-installation-dnf.sh"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - "depot-apt/**"
      - "depot-dnf/**"
      - "docs/cle-publique.asc"
      - ".github/workflows/depot-apt.yml"
      - "scripts/assembler-site-apt.sh"
      - "scripts/lib/publication.sh"
      - "scripts/lib/lire-index-dnf.py"
      - "scripts/tests/tester-installation-dnf.sh"
      - "SECURITY.md"
  workflow_dispatch:

# Droits minimaux du jeton GITHUB_TOKEN : lecture du dépôt seulement. Les droits de publication sont
# accordés au seul job `deployer`.
permissions:
  contents: read

# bash pour toutes les étapes `run`, comme dans paquets.yml : dans un conteneur (job `installation`), GitHub
# utilise sinon `sh -e`, qui ne connaît pas `set -o pipefail` (dash sur Ubuntu et Debian).
defaults:
  run:
    shell: bash

jobs:
  assembler:
    runs-on: ubuntu-24.04
    outputs:
      # « true » si depot-apt/ est encore vide (code 3 du script) : rien à installer ni à publier.
      vide: ${{ steps.assemblage.outputs.vide }}
      # « true » si le site assemblé contient un dépôt dnf (rpm/repodata/) : le job `installation-dnf` n'a lieu qu'alors.
      dnf: ${{ steps.assemblage.outputs.dnf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Le script s'arrête au premier contrôle qui échoue (code 1 : le job échoue alors). Seul le code 3
      # (dépôt vide) est toléré. gpg, gpgv, curl et sha256sum sont présents sur l'image ubuntu-24.04.
      - name: Assemblage et contrôle du site
        id: assemblage
        run: |
          set -uo pipefail
          code=0
          scripts/assembler-site-apt.sh site || code=$?
          case "${code}" in
            0) echo "vide=false" >> "${GITHUB_OUTPUT}"
               if [ -f site/rpm/repodata/repomd.xml ]; then
                 echo "dnf=true" >> "${GITHUB_OUTPUT}"
               else
                 echo "dnf=false" >> "${GITHUB_OUTPUT}"
                 echo "::notice::Pas de dépôt dnf (depot-dnf/rpm/repodata/ absent) : installation-dnf est sautée."
               fi ;;
            3) echo "vide=true" >> "${GITHUB_OUTPUT}"
               echo "dnf=false" >> "${GITHUB_OUTPUT}"
               echo "::notice::Dépôt APT vide : rien à installer ni à publier." ;;
            *) echo "::error::assembler-site-apt.sh a échoué (code ${code})."
               exit "${code}" ;;
          esac
      # Action composite : elle appelle elle-même actions/upload-artifact (normal). Artefact « github-pages »
      # (archive tar), consommé par `installation` et par actions/deploy-pages.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.assemblage.outputs.vide == 'false'
        with:
          path: site
          retention-days: 7

  # Installation réelle depuis le site assemblé, dans un système vierge. Images figées par empreinte (les mêmes
  # que paquets.yml) ; fail-fast: false pour voir les deux résultats.
  installation:
    needs: assembler
    if: needs.assembler.outputs.vide == 'false'
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: ubuntu-24.04
            image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
          - nom: debian-13
            image: debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    steps:
      # ca-certificates : HTTPS de l'image ; tar : décompression de l'artefact. apt (donc gpgv) est déjà là.
      - name: Paquets de base
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates tar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artefact
      # Site décompressé dans /site, clé posée comme l'explique le site (§ 1 de la spécification) et source
      # `file:` : apt vérifie signature et empreintes comme avec `https:`, sans serveur à lancer.
      - name: Source APT locale
        run: |
          set -euo pipefail
          mkdir /site
          tar -xf artefact/artifact.tar -C /site
          # Le sous-processus d'apt (utilisateur _apt) doit pouvoir lire le site.
          chmod -R a+rX /site
          install -d -m 0755 /etc/apt/keyrings
          install -m 0644 /site/wimao.asc /etc/apt/keyrings/wimao.asc
          echo "deb [signed-by=/etc/apt/keyrings/wimao.asc] file:/site stable main" > /etc/apt/sources.list.d/wimao.list
      - name: Installation de wimao
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y wimao
      # Chaque paquet doit être installé à la PLUS HAUTE version de l'index (Packages) : on y lit les
      # versions, on retient la plus haute avec dpkg --compare-versions, puis on la compare à dpkg-query.
      - name: Versions installées
        run: |
          set -euo pipefail
          packages=/site/dists/stable/main/binary-amd64/Packages
          for paquet in wimao wimao-bridge wimao-wine; do
            haute=""
            while read -r version; do
              if [ -z "${haute}" ] || dpkg --compare-versions "${version}" gt "${haute}"; then
                haute="${version}"
              fi
            done < <(awk -v p="${paquet}" '
              /^Package: / { courant = $2 }
              /^Version: / && courant == p { print $2 }' "${packages}")
            [ -n "${haute}" ] || { echo "::error::${paquet} absent de l'index"; exit 1; }
            installee="$(dpkg-query -W -f='${Version}' "${paquet}")"
            echo "${paquet} : installée ${installee}, plus haute de l'index ${haute}"
            [ "${installee}" = "${haute}" ] || { echo "::error::version inattendue pour ${paquet}"; exit 1; }
          done
          wimao-cli --version
      # Preuve que apt protège l'utilisateur : une COPIE du site, où un octet du .deb de wimao est modifié (même
      # taille), sert de source. L'index signé annonce toujours l'ancien SHA256 : apt doit refuser le fichier.
      # `apt-get clean` vide le cache, sinon apt réutiliserait le .deb sain déjà téléchargé.
      - name: Un .deb altéré d'un octet est refusé
        run: |
          set -euo pipefail
          cp -r /site /site-altere
          # Un motif de shell rangé dans un tableau (plutôt que l'analyse de ls) désigne les .deb de wimao.
          # On altère TOUS ceux de la copie, pas un seul : apt réinstalle la version la plus haute, et deviner
          # laquelle (ordre des noms, epoch, « ~ ») serait fragile dès que le pool contient plusieurs versions.
          sains=(/site/pool/*/wimao_*.deb)
          alteres=(/site-altere/pool/*/wimao_*.deb)
          [ "${#sains[@]}" -ge 1 ] || { echo "::error::aucun .deb de wimao dans le site"; exit 1; }
          [ "${#sains[@]}" -eq "${#alteres[@]}" ] || { echo "::error::copie incomplète"; exit 1; }
          for i in "${!alteres[@]}"; do
            deb="${alteres[i]}"
            # Lit l'octet n° 100 et l'écrit modifié (XOR 0xFF), sans changer la taille du fichier.
            octet="$(od -An -tu1 -j100 -N1 "${deb}" | tr -d ' ')"
            nouveau="$(printf '\\%03o' $(( octet ^ 255 )))"
            printf '%b' "${nouveau}" | dd of="${deb}" bs=1 seek=100 conv=notrunc status=none
            if cmp -s "${deb}" "${sains[i]}"; then
              echo "::error::le .deb n'a pas été modifié : ${deb}"; exit 1
            fi
          done
          echo "deb [signed-by=/etc/apt/keyrings/wimao.asc] file:/site-altere stable main" > /etc/apt/sources.list.d/wimao.list
          apt-get update
          apt-get clean
          code=0
          apt-get install -y --reinstall wimao > reinstallation.log 2>&1 || code=$?
          cat reinstallation.log
          # L'échec est exigé (jamais de « || true ») ET pour la bonne raison.
          if [ "${code}" -eq 0 ]; then
            echo "::error::apt a accepté un .deb altéré"; exit 1
          fi
          grep -qiE 'Hash Sum mismatch|Hashes of received file|Size mismatch' reinstallation.log \
            || { echo "::error::échec, mais pas à cause de l'empreinte"; exit 1; }
          echo "ok : apt a refusé le .deb altéré (code ${code})."

  # Installation depuis le dépôt dnf du site assemblé, dans un Fedora vierge (44 et 45, images figées par
  # empreinte, les mêmes que paquets.yml). Sautée tant que le site n'a pas de dépôt dnf. fail-fast: false pour
  # voir les deux résultats.
  installation-dnf:
    needs: assembler
    if: needs.assembler.outputs.vide == 'false' && needs.assembler.outputs.dnf == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: fedora-44
            image: registry.fedoraproject.org/fedora:44@sha256:4b39e947a92d0ac2df1db9ebbf7672256d828a73e6e0219f8a6e774f84f34d64
          - nom: fedora-45
            image: registry.fedoraproject.org/fedora:45@sha256:4a8a63ec2df9f26a96c35ff380237ad578cf42e326b979d9b5801c31c6daf2e8
    steps:
      # tar : décompression de l'artefact et requis par les actions. Le script installe lui-même python3 et
      # diffutils (serveur HTTP et comparaison), APRÈS cette étape : rien d'autre ne masque une dépendance.
      - name: Paquets de base
        run: dnf install -y --setopt=install_weak_deps=False tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artefact
      - name: Site décompressé
        run: |
          set -euo pipefail
          mkdir /site
          tar -xf artefact/artifact.tar -C /site
      # Refus d'un index altéré d'un caractère, puis installation des trois paquets (voir l'en-tête du script).
      - name: Installation depuis le dépôt dnf du site
        run: scripts/tests/tester-installation-dnf.sh /site
      - name: Programme installé
        run: wimao-cli --version

  deployer:
    needs: [assembler, installation, installation-dnf]
    # Jamais sur demande de fusion ; seulement depuis main, et seulement si le dépôt n'est pas vide. Les deux
    # installations doivent avoir réussi ; `installation-dnf` peut en plus être SAUTÉE (pas de dépôt dnf), ce que
    # la condition par défaut d'un job (tous ses `needs` réussis) refuserait : d'où les tests de résultat explicites.
    if: ${{ !cancelled() && needs.assembler.result == 'success' && needs.assembler.outputs.vide == 'false' && needs.installation.result == 'success' && (needs.installation-dnf.result == 'success' || needs.installation-dnf.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    # Droits propres à ce job : publier sur Pages et prouver l'origine du déploiement (jeton OIDC).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    # Un seul déploiement à la fois, sans jamais en interrompre un en cours.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploiement
