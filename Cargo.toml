# Espace de travail Cargo de WiMao. Voir ARCHITECTURE.md pour le rôle de chaque crate.
[workspace]
resolver = "2"
members = ["crates/wimao-core", "crates/wimao-recettes", "crates/wimao-cli", "crates/wimao"]

# Métadonnées partagées par toutes les crates (héritées avec `workspace = true`).
[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/F1ghtc0re/WiMao"
# Version minimale de Rust, vérifiée le 2026-11-02 (cargo +1.93.1 test --workspace --no-run) : gtk4 et pango
# exigent 1.92 pour compiler l'application, serial_test 4 (tests seulement) 1.93.1. Pour la remonter
# ensuite : `cargo metadata --format-version 1 | jq -r '.packages[].rust_version // empty' | sort -V | tail -1`.
rust-version = "1.93.1"

[workspace.dependencies]
libc = "0.2"
clap = { version = "4.6.7", features = ["derive"] }
assert_cmd = "2.2.2"
thiserror = "2"
# Interface graphique : GTK 4.12+ (FileDialog, CssProvider::load_from_string) et libadwaita 1.5+ (AlertDialog).
gtk4 = { version = "0.11.5", features = ["v4_12"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
async-channel = "2.5.0"
wimao-core = { path = "crates/wimao-core" }
wimao-recettes = { path = "crates/wimao-recettes" }
